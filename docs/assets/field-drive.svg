<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" fill="none">
  <title>Exploded longitudinal section of a shaft, flanged hub, ball bearing, housing and end cover</title>
  <defs>
    <pattern id="section" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="m-1 1 2-2m-2 7 7-7m-2 7 2-2" stroke="#989b87" stroke-width=".65"/>
    </pattern>
    <pattern id="alloy" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="m-1 5 2 2m-2-8 8 8m-2-8 2 2" stroke="#e2c86a" stroke-width=".75"/>
    </pattern>
    <g id="housing">
      <path d="m244 64 3-3h12v5h40v-4h8v3h7l4 4v19h-5v5h-35V75h-31l-3 3Z" fill="#30352e"/>
      <path d="m244 64 3-3h12v5h40v-4h8v3h7l4 4v19h-5v5h-35V75h-31l-3 3Z" fill="url(#section)" stroke="#dfdfce"/>
      <path d="M250 64v8m3-8v8m10-6v6m8-6v6m8-6v6m8-6v6m8-6v6" stroke="#909684" stroke-width=".7"/>
      <path d="M280 91h30v-5h6m-20-8h22m-22-2.8h20" stroke="#c4c8b6" stroke-width=".8"/>
    </g>
    <g id="race">
      <path d="M189 76v-6h27v6l-2 2h-6q-5.5-5-11 0h-6Z" fill="#30352e" stroke="#dedfce"/>
      <path d="M190 71.5h25" stroke="#9ca491" stroke-width=".65"/>
      <path d="M189 87.5h8q5.5 5.5 11 0h8V93h-27Z" fill="url(#section)" stroke="#dfdfce"/>
      <circle cx="202.5" cy="82.5" r="6.1" fill="#424638" stroke="#f0de87"/>
      <path d="M199.6 79.7a4.2 4.2 0 0 1 4.5-1" stroke="#f2edc9" stroke-width=".8"/>
      <path d="M190.7 78.7v7.5m23.6-7.5v7.5" stroke="#e4ce6c" stroke-width="1.4"/>
    </g>
    <path id="hub" d="m105 78 3-3h28v-8l2-2h13l2 2v23h-48Z"/>
  </defs>
  <!-- Centre line and witness marks, visible through the bores. -->
  <g stroke="#8e9382" stroke-width=".65">
    <path d="M8 102h363" stroke-dasharray="14 3 2 3"/>
    <path d="M203 61v81" stroke-dasharray="9 2 1.5 2"/>
    <path d="M15 162v14m74-20v20m16-30v30m48-31v31m36-33v17m27-17v17m28-13v29m74-36v36m20-30v16m17-15v15"/>
    <path d="M16 171h72m18 0h46m38-16h25m30 16h72m22-16h15"/>
    <path d="m13 174 5-6m68 6 5-6m11 6 5-6m43 6 5-6m32-10 5-6m22 6 5-6m23 22 5-6m69 6 5-6m17-10 5-6m12 6 5-6" stroke="#b7bcaa"/>
  </g>
  <!-- Stepped shaft; retaining groove and parallel key. -->
  <path d="m15 95 3-3h10v2h3v-2h15v-2h20v1h22l2 2v18l-2 2H66v1H46v-2H31v-2h-3v2H18l-3-3Z" fill="#343930" stroke="#dedfce" stroke-width="1.25"/>
  <path d="M18 94v16m10-14v12m18-16v20m20-20v20m22-18v16M19 106h66" stroke="#89917f" stroke-width=".65"/>
  <path d="m47 85 2-2h14l2 2v3H47Z" fill="#b59f51" stroke="#f0dc82"/>
  <path d="M49 80v-4m14 4v-4" stroke="#919883" stroke-width=".7"/>
  <!-- Flanged coupling; crossed hatch distinguishes it from its neighbouring housing. -->
  <use href="#hub" fill="url(#alloy)" stroke="#dedfce" stroke-width="1.1"/>
  <use href="#hub" transform="translate(0 204) scale(1 -1)" fill="url(#alloy)" stroke="#dedfce" stroke-width="1.1"/>
  <path d="M109 89v-3h21v3m9-18h14m-14 2h14m-14 58h14m-14 2h14" stroke="#d8d5b5" stroke-width=".85"/>
  <path d="M106 102h47" stroke="#c6c9b5" stroke-width=".55" stroke-dasharray="8 2 1.5 2"/>
  <!-- Symmetric radial section: outer race, rolling element, cage and inner race. -->
  <use href="#race"/><use href="#race" transform="translate(0 204) scale(1 -1)"/>
  <use href="#housing"/><use href="#housing" transform="translate(0 204) scale(1 -1)"/>
  <!-- End cover and seal land. -->
  <g stroke="#dfdfce" stroke-width="1.05">
    <path d="M338 75h6V63h8l3 3v27h-17Z" fill="url(#section)"/>
    <path d="M338 129h6v12h8l3-3v-27h-17Z" fill="url(#section)"/>
  </g>
  <path d="M338 86h9v4h-9Zm0 28h9v4h-9Z" fill="#d5bd64"/>
  <path d="M344 77h11m-11 2h11m-11 46h11m-11 2h11" stroke="#c9ccba" stroke-width=".75"/>
  <!-- Broken leaders are inspection marks, not fictitious measurements. -->
  <g stroke="#b8bdab" stroke-width=".8" stroke-linejoin="round">
    <path d="m56 82-12-23H17m125 3 13-19h27m26 24 16-30h28m36 26 15-22h27m15 22 14-15h13"/>
  </g>
  <g fill="#e7cf70">
    <circle cx="56" cy="82" r="1.5"/><circle cx="142" cy="62" r="1.5"/><circle cx="208" cy="67" r="1.5"/><circle cx="288" cy="63" r="1.5"/>
  </g>
  <path d="M11 36V23h14m344 0h-14m14 0v13M11 181v7h14m344-7v7h-14" stroke="#686e60" stroke-width=".8"/>
</svg>
