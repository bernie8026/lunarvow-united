<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 166" fill="none">
  <title>Exploded rotor study</title>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#6c756f"/></pattern>
    <pattern id="ribs" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M1 0v5" stroke="#9caa9e" stroke-width=".8"/></pattern>
    <g id="fastener"><ellipse rx="3.4" ry="1.6" fill="#17201d" stroke="#b8c0b2" stroke-width=".9"/></g>
  </defs>
  <rect width="486" height="166" fill="#202723"/>
  <path fill="url(#dots)" d="M0 0h486v166H0z" opacity=".52"/>
  <g stroke="#7b897f" stroke-width=".7" opacity=".8">
    <path d="M15 9v148m456-148v148M10 18h10m446 0h10M10 148h10m446 0h10"/>
    <path stroke-dasharray="4 5" d="M44 137l292-107M116 15l186 136m-90-138v143"/>
    <path d="M343 112h101m-101 5h70m-70 5h86"/>
  </g>
  <!-- Lower mounting flange, shown separately from the motor. -->
